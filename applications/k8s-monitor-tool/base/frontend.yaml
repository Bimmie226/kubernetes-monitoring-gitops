apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: k8s-monitor
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index monitoring.html;

        client_max_body_size 5m;

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            proxy_pass http://backend:8000;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: k8s-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-monitor-frontend
  template:
    metadata:
      labels:
        app: k8s-monitor-frontend
    spec:
      automountServiceAccountToken: false

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: frontend
          image: luongngocvu/k8s-tool-fe:k8s-v2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: k8s-monitor
spec:
  type: LoadBalancer
  selector:
    app: k8s-monitor-frontend
  ports:
    - port: 80
      targetPort: 80
