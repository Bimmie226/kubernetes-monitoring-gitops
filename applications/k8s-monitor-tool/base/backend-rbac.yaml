apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-monitor-backend
  namespace: k8s-monitor

--- 

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-monitor-backend-cluster-admin
subjects:
  - kind: ServiceAccount
    name: k8s-monitor-backend
    namespace: k8s-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin