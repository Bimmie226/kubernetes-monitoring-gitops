apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: k8s-monitor-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-monitor-mariadb-pv
  labels:
    storage-app: k8s-monitor-mariadb
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: k8s-monitor-local
  local:
    path: /data/k8s-monitor/mariadb
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - controlplane
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-monitor-redis-pv
  labels:
    storage-app: k8s-monitor-redis
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: k8s-monitor-local
  local:
    path: /data/k8s-monitor/redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - controlplane 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: k8s-monitor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: k8s-monitor-local
  selector:
    matchLabels:
      storage-app: k8s-monitor-mariadb
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: k8s-monitor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: k8s-monitor-local
  selector:
    matchLabels:
      storage-app: k8s-monitor-redis
  resources:
    requests:
      storage: 2Gi
